name: public-trading-bot

on:
  workflow_dispatch: {}
  schedule:
    # Every 15 minutes, Monday–Friday.
    # We purposely use a wide UTC window and rely on your market-hours gate.
    - cron: "*/15 * * * 1-5"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot (one cycle)
        env:
          MODE: "live"
          RUN_ONCE: "1"

          # REQUIRED
          PUBLIC_SECRET: ${{ secrets.PUBLIC_SECRET }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}


          # Growth config (hardcoded here instead of secrets)
          MAX_TRADES_PER_DAY: "3"
          MAX_ORDER_AMOUNT_USD: "10"
          TAKE_PROFIT_BASE: "0.03"
          STOP_LOSS_BASE: "0.02"

          WITHDRAW_DATE: "2026-05-10"
          LOCKDOWN_DAYS: "14"

          # Regime filter
          REGIME_SYMBOL: "SPY"
          REGIME_FAST: "50"
          REGIME_SLOW: "200"

          # Volatility filter
          ATR_PERIOD: "14"

          # Trend strength
          TREND_FAST: "20"
          TREND_SLOW: "50"

          # Position scaling
          BASE_POSITION_SIZE: "1.0"
          MAX_POSITION_SCALE: "2.0"


          MAX_EXPOSURE_EARLY: "0.90"
          MAX_EXPOSURE_MID: "0.75"
          MAX_EXPOSURE_LATE: "0.50"

          MAX_DRAWDOWN: "0.08"
          DAILY_LOSS_LIMIT: "0.03"

          TZ: "America/New_York"
        run: |
          python bot.py


      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: logs/*.csv
          if-no-files-found: ignore
