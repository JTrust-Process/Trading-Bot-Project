name: public-trading-bot

on:
  workflow_dispatch: {}
  schedule:
    # Every 15 minutes, Monday–Friday.
    - cron: "*/15 * * * 1-5"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot (one cycle)
        env:
          MODE: "live"
          RUN_ONCE: "1"

          # ── Secrets ────────────────────────────────────────────────────────
          PUBLIC_SECRET: ${{ secrets.PUBLIC_SECRET }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

          # ── Symbols ────────────────────────────────────────────────────────
          SYMBOLS: "CMCSA,COP,CVX,DUK,ITOT,IVV,KO,MDT,MO,PEP,PM,QQQ,SCHB,SCHD,SGOV,SPY,VOO,VTI,VXUS,VZ"
          SCAN_SYMBOLS: "AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA"
          MANAGE_ALL_POSITIONS: "true"

          # ── Momentum-rotation ──────────────────────────────────────────────
          MOMENTUM_SYMBOLS: "AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,QQQ,SPY"
          MOMENTUM_TOP_N: "3"
          MOMENTUM_SELL_RANK: "5"

          # ── Trade sizing ───────────────────────────────────────────────────
          MAX_TRADES_PER_DAY: "10"
          MAX_ORDER_AMOUNT_USD: "10"
          MAX_OPEN_POSITIONS: "5"
          BASE_POSITION_SIZE: "0.10"
          MAX_POSITION_SCALE: "2.0"

          # ── TP / SL ────────────────────────────────────────────────────────
          TAKE_PROFIT_BASE: "0.04"
          STOP_LOSS_BASE: "0.02"

          # ── Risk / drawdown ────────────────────────────────────────────────
          MAX_DRAWDOWN: "0.08"
          DAILY_LOSS_LIMIT: "0.03"
          LOSS_COOLDOWN_DAYS: "3"

          # ── Exposure cap ───────────────────────────────────────────────────
          MAX_EXPOSURE_EARLY: "0.90"

          # ── Regime filter ──────────────────────────────────────────────────
          REGIME_SYMBOL: "SPY"
          REGIME_FAST: "50"
          REGIME_SLOW: "200"

          # ── ATR / trend ────────────────────────────────────────────────────
          ATR_PERIOD: "14"
          ATR_VOL_THRESHOLD: "0.01"
          TREND_FAST: "5"
          TREND_SLOW: "20"
          TREND_STRONG_THRESHOLD: "0.5"

          TZ: "America/New_York"

        run: |
          python bot.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: logs/*.csv
          if-no-files-found: ignore