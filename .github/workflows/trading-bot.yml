name: public-trading-bot

on:
  workflow_dispatch: {}
  schedule:
    # Every 15 minutes during market hours (9:30am-4pm ET = 13:30-20:00 UTC)
    # Offset from :00/:15/:30/:45 to avoid GHA high-load queuing
    - cron: "7,22,37,52 13-20 * * 1-5"

concurrency:
  group: public-trading-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot (one cycle)
        env:
          MODE: "live"
          RUN_ONCE: "1"

          # ── Secrets ────────────────────────────────────────────────────────
          PUBLIC_SECRET: ${{ secrets.PUBLIC_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}

          # ── Symbols ────────────────────────────────────────────────────────
          SYMBOLS: "QQQ,SCHB,SCHD,SGOV,SPY,VTI"
          SCAN_SYMBOLS: "AAPL,MSFT,NVDA,AMZN,GOOGL,TSLA"
          MANAGE_ALL_POSITIONS: "true"

          # ── Momentum-rotation ──────────────────────────────────────────────
          MOMENTUM_SYMBOLS: "AAPL,MSFT,NVDA,AMZN,GOOGL,TSLA,QQQ,SPY"
          MOMENTUM_TOP_N: "3"
          MOMENTUM_SELL_RANK: "5"

          # ── Trade sizing ───────────────────────────────────────────────────
          MAX_TRADES_PER_DAY: "5"
          MAX_ORDER_AMOUNT_USD: "15"
          MAX_OPEN_POSITIONS: "8"
          BASE_POSITION_SIZE: "0.10"
          MAX_POSITION_SCALE: "2.0"
 
          # ── TP / SL ────────────────────────────────────────────────────────
          TAKE_PROFIT_BASE: "0.05"
          STOP_LOSS_BASE: "0.025"
          CONFIDENCE_MIN_THRESHOLD: "0.65"
          BREAKOUT_LOOKBACK: "25"
          BREAKOUT_VOL_MULTIPLIER: "1.2"
 
          # ── Risk / drawdown ────────────────────────────────────────────────
          MAX_DRAWDOWN: "0.08"
          DAILY_LOSS_LIMIT: "0.03"
          LOSS_COOLDOWN_DAYS: "3"
          MIN_HOLD_DAYS: "2"
 
          # ── Exposure cap ───────────────────────────────────────────────────
          MAX_EXPOSURE_EARLY: "0.90"
 
          # ── Regime filter ──────────────────────────────────────────────────
          REGIME_SYMBOL: "SPY"
          REGIME_FAST: "20"
          REGIME_SLOW: "50"
 
          # ── ATR / trend ────────────────────────────────────────────────────
          ATR_PERIOD: "14"
          ATR_VOL_THRESHOLD: "0.01"
          TREND_FAST: "5"
          TREND_SLOW: "20"
          TREND_STRONG_THRESHOLD: "0.5"
 
          TZ: "America/New_York"
 
        run: |
          python bot.py
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: logs/*.csv
          if-no-files-found: ignore