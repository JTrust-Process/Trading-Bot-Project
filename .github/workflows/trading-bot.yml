name: public-trading-bot

on:
  workflow_dispatch: {}
  schedule:
    # Every 15 minutes, Monday–Friday.
    # We purposely use a wide UTC window and rely on your market-hours gate.
    - cron: "*/15 * * * 1-5"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot (one cycle)
        env:
          MODE: "live"
          RUN_ONCE: "1"

          PUBLIC_SECRET: ${{ secrets.PUBLIC_SECRET }}

          MAX_TRADES_PER_DAY: ${{ secrets.MAX_TRADES_PER_DAY }}
          MAX_ORDER_AMOUNT_USD: ${{ secrets.MAX_ORDER_AMOUNT_USD }}
          TAKE_PROFIT_PCT: ${{ secrets.TAKE_PROFIT_PCT }}
          STOP_LOSS_PCT: ${{ secrets.STOP_LOSS_PCT }}

          # Optional: for logs / timezone clarity
          TZ: "America/New_York"
        run: |
          python bot.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: logs/*.csv
          if-no-files-found: ignore
